
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Online Shopping Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Online Shopping Store 🛍️</h1>
        <p>Find your favourite products here!</p>
    </header>

    <div class="container">

        <button onclick="getProducts()">Load Products</button>

        <button onclick="viewCart()">View Cart 🛒</button>

        <h2>Our Products</h2>

        <div id="products"></div>

        <h2>My Shopping Cart</h2>

        <h3 id="cart-count">Cart Items: 0</h3>

        <div id="cart-products"></div>

        <h3 id="total-price">Total Price: ₹0</h3>

    </div>


    <script>

        let products = [];
        let cartItems = [];


        // 1. Load Products using Promise Chaining

        function getProducts() {

            fetch("http://localhost:5000/api/products")

                .then((response) => {
                    return response.json();
                })

                .then((data) => {

                    products = data.products;

                    let output = "";

                    data.products.forEach((product) => {

                        output += `
                            <div class="product-card">

                                <h3>${product.title}</h3>

                                <img src="${product.image}" alt="${product.title}">

                                <p>Price: ₹${product.price}</p>

                                <p>Category: ${product.category}</p>

                                <p>Rating: ${product.rating.rate} ⭐</p>

                                <p>Total Reviews: ${product.rating.count}</p>

                                <button onclick="addToCart(${product.id})">
                                    Add to Cart 🛒
                                </button>

                            </div>
                        `;

                    });

                    document.getElementById("products").innerHTML = output;

                })

                .catch((error) => {

                    console.log("Error:", error);

                    alert("Unable to load products!");

                });

        }


        // 2. Add Products to Cart

        function addToCart(productId) {

            let selectedProduct = cartItems.find((item) => {
                return item.id === productId;
            });

            if (selectedProduct) {

                selectedProduct.quantity++;

            } else {

                cartItems.push({
                    id: productId,
                    quantity: 1
                });

            }

            updateCartCount();

            console.log("Product added successfully!");

        }


        // 3. Update Cart Count

        function updateCartCount() {

            let totalItems = 0;

            cartItems.forEach((item) => {

                totalItems += item.quantity;

            });

            document.getElementById("cart-count").innerHTML =
                "Cart Items: " + totalItems;

        }


        // 4. View Cart

        function viewCart() {

            let output = "";
            let totalPrice = 0;

            cartItems.forEach((item) => {

                let product = products.find((p) => {
                    return p.id === item.id;
                });

                if (product) {

                    let itemTotal = product.price * item.quantity;

                    totalPrice += itemTotal;

                    output += `
                        <div class="product-card cart-item">

                            <h3>${product.title}</h3>

                            <img src="${product.image}" alt="${product.title}">

                            <p>Price: ₹${product.price}</p>

                            <p>Quantity: ${item.quantity}</p>

                            <p>Subtotal: ₹${itemTotal.toFixed(2)}</p>

                            <button onclick="removeFromCart(${item.id})">
                                Remove from Cart ❌
                            </button>

                        </div>
                    `;

                }

            });

            document.getElementById("cart-products").innerHTML =
                output || "Your cart is empty!";

            document.getElementById("total-price").innerHTML =
                "Total Price: ₹" + totalPrice.toFixed(2);

            document.getElementById("cart-products").scrollIntoView({
                behavior: "smooth"
            });

        }


        // 5. Remove Product from Cart

        function removeFromCart(productId) {

            cartItems = cartItems.filter((item) => {

                return item.id !== productId;

            });

            updateCartCount();

            viewCart();

        }

    </script>

</body>

</html>
